version: '1.0'
name: tag-jitpack-pipeline
displayName: TagJitPackPipeline
stages:
  - stage:
    name: activate_jitpack
    displayName: Activate JitPack
    steps:
      - step: build@gcc
        name: trigger_and_wait_jitpack
        displayName: Trigger and wait JitPack build
        gccVersion: 10.3
        commands:
          - |
            set -e

            TAG=""
            if command -v git >/dev/null 2>&1; then
              TAG=$(git tag --points-at HEAD 2>/dev/null | head -n 1 || true)
            fi
            if [ -z "$TAG" ]; then
              TAG="${GITEE_TAG:-}"
            fi
            if [ -z "$TAG" ]; then
              TAG="${GITEE_BRANCH:-}"
            fi
            if [ -z "$TAG" ]; then
              echo "Could not resolve the pushed tag from the workspace or Gitee Go parameters" >&2
              exit 1
            fi

            echo "Resolved JitPack tag: $TAG"
            JITPACK_GROUP="com/gitee/xlk_gitee"
            JITPACK_REPO="paperless_sdk"
            JITPACK_GROUP_API="com.gitee.xlk_gitee"

            # The first request for a tag makes JitPack check out the code and build it.
            POM_URL="https://jitpack.io/${JITPACK_GROUP}/${JITPACK_REPO}/${TAG}/${JITPACK_REPO}-${TAG}.pom"
            echo "Requesting ${POM_URL}"
            wget -q -O /dev/null "$POM_URL" || true

            BUILD_API="https://jitpack.io/api/builds/${JITPACK_GROUP_API}/${JITPACK_REPO}/${TAG}"
            for i in $(seq 1 60); do
              STATUS=$(wget -qO- "$BUILD_API" | jq -r '.status // empty' 2>/dev/null || true)
              echo "JitPack status: ${STATUS:-unknown}"
              case "$STATUS" in
                ok)
                  echo "JitPack build succeeded for $TAG"
                  exit 0
                  ;;
                Error|error|needAuth|NotFound|not_found)
                  echo "JitPack build failed or requires authentication: ${STATUS:-unknown}" >&2
                  exit 1
                  ;;
              esac
              sleep 10
            done

            echo "JitPack build did not finish within 10 minutes" >&2
            exit 1
triggers:
  push:
    tags:
      include:
        - '^.*$'
