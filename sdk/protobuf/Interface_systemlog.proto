	PB_SYSTEMLOG_OPER_HELPSIGN=  59;//辅助签到
	PB_SYSTEMLOG_OPER_NOSIGNENTER= 60 ;//免签
	PB_SYSTEMLOG_OPER_OPENOUTSIDE=  61;//外部打开文档
	PB_SYSTEMLOG_OPER_PROTECTDATA=  62;//资料保护
	PB_SYSTEMLOG_OPER_MODIFYDEVICE=  63;//修改设备信息
	PB_SYSTEMLOG_OPER_DELDEVICE=  64;//删除设备
	PB_SYSTEMLOG_OPER_SETINI=  65;//参数配置
	PB_SYSTEMLOG_OPER_COMMONADD= 66 ;//添加
	PB_SYSTEMLOG_OPER_COMMONMODIFY=67  ;//修改
	PB_SYSTEMLOG_OPER_COMMONDELETE=  68;//删除
	PB_SYSTEMLOG_OPER_COMMONSAVE=  69;//保存
	PB_SYSTEMLOG_OPER_COMMONIMPORT=  70;//导入
	PB_SYSTEMLOG_OPER_COMMONEXPORT=  71;//导出
	PB_SYSTEMLOG_OPER_COMMONSTART=  72;//开始
	PB_SYSTEMLOG_OPER_COMMONSTOP=  73;//结束
	PB_SYSTEMLOG_OPER_COMMONDETAIL=  74;//查询详情
	PB_SYSTEMLOG_OPER_SETHOST=  75;//设置主持人
	PB_SYSTEMLOG_OPER_COMMONADDGROUP= 76 ;//添加分组
	PB_SYSTEMLOG_OPER_COMMONMODIFYGROUP=77  ;//修改分组
	PB_SYSTEMLOG_OPER_COMMONDELETEGROUP=  78;//删除分组
