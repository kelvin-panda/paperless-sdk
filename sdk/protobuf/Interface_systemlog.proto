	PB_SYSTEMLOG_OPER_LIFTDOWN= 54 ;//设备下降
	PB_SYSTEMLOG_OPER_LIFTSTOP=  55;//设备停止
	PB_SYSTEMLOG_OPER_SOFTREBOOT=  56;//软件重启
	PB_SYSTEMLOG_OPER_WAKUP=  57;//设备唤醒
