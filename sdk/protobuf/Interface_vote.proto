//type:TYPE_MEET_INTERFACE_MEETNEWVOTESIGNED
//method: queryproperty
message pbui_Type_MeetNewVoteQueryProperty
{
	fixed32 propertyid=1;//数据ID
	fixed32 voteid=2;//传入参数
	fixed32 memberid=3;//传入参数 为0表示本身
}

//orderid
enum Pb_NewVoteOrderId 
{
Pb_MEET_NEWVOTE_ORDERID_ZERO=0;
Pb_MEET_NEWVOTE_ORDERID_FTJDPT=1;//1=方图戒毒平台订制投票推送
}

//type:TYPE_MEET_INTERFACE_MEETONNEWVOTING
//method: METHOD_MEET_INTERFACE_PUSH
message pbui_Type_MeetNotifyPushNewVoteInfo
{
	fixed32  orderid=1;//MEET_NEWVOTE_ORDERID_FTJDPT
	bytes    pjson=2;	//{"meetid":1,"voteid":[1,2,3]} //voteid 为空表示全部投票
}

