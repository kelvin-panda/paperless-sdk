//stages：STAGE_ComplexMeetUserInfo
//fun: FUN_One 
//method:查询、修改

/*修改使用PD_SmartJsonProtol
{
"typ":1,//Pb_COMPLEX_MEET_TYP_MEMBER
"flag":1,//PB_COMPLEX_MEET_FLAG_CLEARSAVE表示针对typ的项清空再修改，否则就是更新
"data":[
{"id1":"1,"id2":"0","id3":"0","item":[{"datid":"1","str":"abc"},{"datid":"2","str":"efg"}]},//如果是删除则不需要设置str字段值
{"id1":"2,"item":[{"datid":"1","str":"abc"},{"datid":"2","str":"efg"}]},

]
}
*/

/*
查询使用PD_SmartJsonProtol，仅支持查询指定会议的全部
返回查询使用PD_SmartJsonProtolEx
{
"data":[
{"typ":1,"id1":"1,"id2":"0","id3":"0","datid":"1","str":"abc"},
{"typ":2,"id1":"1,"id2":"1","id3":"0","datid":"2","str":"abc"},
{"typ":1,"id1":"2,"id2":"0","id3":"1","datid":"3","str":"abc"},
]
}
*/

message pbui_Item_ComplexMeetInfo
{
	fixed32   typ=1;
	fixed32   id1=2;
	fixed32   id2=3;
	fixed32   id3=4;
	fixed32   dataid=5;
	bytes     ptext=6; 
}

//call
//type:TYPE_MEET_INTERFACE_COMPLEXMEETUSERDEF
//method: 
//query|使用Type_QueComplexPubInfo
message pbui_Type_QueComplexMeetInfo
{
	fixed32   typ=1;//指定typ  定义 COMPLEX_PUBLIC_TYP_ADMIN
	fixed32   id1=2;//匹配id1 为0表示typ下的所有id
	fixed32   id2=3;//匹配id2 为0表示typ下的所有id
	fixed32   id3=4;//匹配id3 为0表示typ下的所有id
	repeated pbui_Item_ComplexMeetInfo item=5;
}

//call
//type:TYPE_MEET_INTERFACE_COMPLEXMEETUSERDEF
//method: 
//modify|使用Interface_base.proto 中的pbui_Type_SmartJsonProtol  
//METHOD_MEET_INTERFACE_SINGLEQUERYBYID|使用Type_SingleQueComplexMeetInfo 
message pbui_Type_SingleQueComplexMeetInfo
{
	fixed32   typ=1;
	fixed32   id1=2;
	fixed32   id2=3;
	fixed32   id3=4;
	fixed32   dataid=5;
	bytes     ptext=6; 
}

//callback
//type:TYPE_MEET_INTERFACE_COMPLEXMEETUSERDEF
//method: notify
message pbui_Type_ComplexMeetUserdefNotify
{
	fixed32   opermethod=1;//本次通知是因为opermethod方法触发的
	fixed32   typ=2;
	fixed32   id1=3;
	fixed32   id2=4;
	fixed32   id3=5;
	fixed32   dataid=6;

}
