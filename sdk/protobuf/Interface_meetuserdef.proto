syntax = "proto3";
option java_package = "com.mogujie.tt.protobuf";
option optimize_for = LITE_RUNTIME;

import "Interface_Macro.proto";

//会议自定义数据项ID
enum Pb_MeetUserDefFlag 
{
Pb_MeetUserDef_ZERO=0;
Pb_MeetUserDef_SLOGAN =1;//会议标语
}

message pbui_Type_MeetUserdefItemInfo
{
	fixed32 id=1;   //数据id 用户自行约定
	bytes  text=2;  //
}

//call
//type:TYPE_MEET_INTERFACE_MEETUSERDEF
//method: 
//METHOD_MEET_INTERFACE_SINGLEQUERYBYID|使用pbui_QueryInfoByID 
//modify|delete|使用pbui_Type_MeetUserdefInfo
message pbui_Type_MeetUserdefInfo
{
	fixed32 meetid=1;   //指定会议id 为0表示当前会议
	repeated pbui_Type_MeetUserdefItemInfo item =2;
}

///////////comlexmeetuserdef///////////////////////////////////////////////////////////////
enum PB_COMPLEX_MEET_FLAG 
{
PB_COMPLEX_MEET_FLAG_ZERO=0;
PB_COMPLEX_MEET_FLAG_CLEARSAVE=0x000000001;//表示清空再修改，否则就是更新
}

//会根据typ和id1，在删除指定的id1时会关联删除这些自定义数据
//typ最大值不能超过255
//datid最大值不能超过255
enum Pb_COMPLEX_MEET_TYP 
{
Pb_COMPLEX_MEET_TYP_ZERO=0;
Pb_COMPLEX_MEET_TYP_MEMBER=		1;///typ=1指参会人员,id1是人员id，id2=0,id3=0
Pb_COMPLEX_MEET_TYP_AGENDA=		2;//typ=2指议题,id1是议题id，id2=0,id3=0
Pb_COMPLEX_MEET_TYP_DIR=		3;//typ=3指目录,id1是目录id，id2=0,id3=0
Pb_COMPLEX_MEET_TYP_FILE=		4;//typ=4指目录文件,id1是目录id，id2=文件id,id3=0
Pb_COMPLEX_MEET_TYP_MEMFILE=	5;//typ=5指参会人文件,id1是参会人员id，id2=目录id,id3=文件id
Pb_COMPLEX_MEET_TYP_VOTE=		6;//typ=6指投票,id1是投票id，id2=0,id3=0
Pb_COMPLEX_MEET_TYP_NEWVOTE=	7;//typ=6指新投票,id1是投票id，id2=0,id3=0
}

//约定各typ下的dataid=1用于存放基本信息
//typ=COMPLEX_MEET_TYP_MEMBER
enum Pb_CMX_MEET_MEM_DATAID 
{
Pb_CMX_MEET_MEM_DATAID_ZERO=0;
Pb_CMX_MEET_MEM_DATAID_BASE= 1; //目录文件的基本信息
}

/*
{
}
*/
//typ=COMPLEX_MEET_TYP_AGENDA
enum Pb_CMX_MEET_AGENDA_DATAID 
{
Pb_CMX_MEET_AGENDA_DATAID_ZERO=0;
Pb_CMX_MEET_AGENDA_DATAID_BASE= 1; //目录文件的基本信息
}
/*
{
}
*/
//typ=COMPLEX_MEET_TYP_DIR
enum Pb_CMX_MEET_DIR_DATAID 
{
Pb_CMX_MEET_DIR_DATAID_ZERO=0;
Pb_CMX_MEET_DIR_DATAID_BASE= 1; //目录文件的基本信息
}
/*
{
}
*/
//typ=COMPLEX_MEET_TYP_FILE
enum Pb_CMX_MEET_FILE_DATAID 
{
Pb_CMX_MEET_FILE_DATAID_ZERO=0;
Pb_CMX_MEET_FILE_DATAID_BASE= 1; //目录文件的基本信息
}
/*
{
"pagenum":3,//页码
}
*/
//typ=COMPLEX_MEET_TYP_MEMFILE
enum Pb_CMX_MEET_MEEFILE_DATAID 
{
Pb_CMX_MEET_MEEFILE_DATAID_ZERO=0;
Pb_CMX_MEET_MEEFILE_DATAID_BASE= 1; //目录文件的基本信息
}
/*
{
}
*/
//typ=COMPLEX_MEET_TYP_VOTE
enum Pb_CMX_MEET_VOTE_DATAID 
{
Pb_CMX_MEET_VOTE_DATAID_ZERO=0;
Pb_CMX_MEET_VOTE_DATAID_BASE= 1; //目录文件的基本信息
}
/*
{
